<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <title>Testing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Vite dev server prefers the leading slash -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <script type="module" src="/src/dev-main.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }

      main {
        min-height: 80vh;
        padding: 2rem;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      csis-audio-brief {
        margin-top: 400px;
        margin-bottom: 20px;
      }
    </style>
  </head>

  <body>
    <main>
      <csis-progress-bar height="6" fill-color="#cc0000"
        track-color="rgba(0,0,0,0.08)"></csis-progress-bar>
      <h1>Test page</h1>
      <p>
        This is just some placeholder content so we can see where the footer
        ends up on the page.
      </p>
      <div style="height: 100vh;"></div>
      <h1>test</h1>
      <csis-geran-drone
        timeline-url="https://docs.google.com/spreadsheets/d/e/2PACX-1vQJhKyoUuHYsIufykjxLbQN9wcgJU_Jd7zzzjQcPwEKrzHxBzL4dfqtBlGcpDw2Ms3NPOoaSMSkkYmi/pub?gid=1840066445&single=true&output=csv"
        sources-url="https://docs.google.com/spreadsheets/d/e/2PACX-1vQJhKyoUuHYsIufykjxLbQN9wcgJU_Jd7zzzjQcPwEKrzHxBzL4dfqtBlGcpDw2Ms3NPOoaSMSkkYmi/pub?gid=408213327&single=true&output=csv"
        assets-url="https://res.cloudinary.com/csisideaslab/image/upload/v1787777490/wadhwani-ai-center/2026/geran-drone/assets"
      ></csis-geran-drone>


      <div class="component-wrap">

        <csis-satellite-snapshot
  data-url="https://docs.google.com/spreadsheets/d/e/2PACX-1vQd77u3vnU8LrKR3xv8mIlWTcj0A0RvjQgb5pbCYv39nxjOr_I4i70we1oLaz7om1Xwm3aLvVyAoNcT/pub?output=csv"
  magnifier="on"
  btn-color="#f1f1f1"
  btn-svg-color="#f1f1f1"
  btn-bg-color="#555555"
  btn-border-color="#999999"
  btn-hover-color="#222222"
  btn-gap="0"
  img-object-fit="fill"
  timeline-line-color="#f1f1f1"
  timeline-circle-color="#222222"
  timeline-circle-border-color="#f1f1f1"
  timeline-circle-selected-border-color="#e6332e"
  timeline-circle-size="20px"
  timeline-year-color="#333333"
  title-color="#fff"
  title-font-size="1.6rem"
  date-font-color="#aaa"
  description-font-color="#eee"
  description-font-size="1.2rem"
  text-box-background-color="#333333"
  text-box-border-color="#333333"
  text-box-border-radius="8px"
  box-font-url="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&display=swap"
  box-font-family="'IBM Plex Sans', sans-serif"
  timeline-content-border-thickness = "2px"
  timeline-content-border-color = "#666666"
  timeline-content-border-radius = ".5rem"
  timeline-content-padding = "1rem"
  timeline-content-background-color = "#333333"
  />
<csis-translation-scramble
  top-text="政策态势及中拉合作展望。"
  bottom-text="The Policy Trajectory and Prospects for China-Latin America Cooperation"
  height="220"
  bg-color="#1d1e22"
  text-color="#ccf0e6"
  dud-color="#42c3c8"
  ghost-color="#d93da5"
  label-color="#8e3b32"
  trigger-start="top 40%"
  speed="2"
  reveal-delay="0"
  font-url="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Space+Mono:wght@400;700&display=swap"
  cjk-font-family='"Noto Sans SC", sans-serif'
  latin-font-family='"Space Mono", ui-monospace, monospace'
  label-font-family='"Space Mono", ui-monospace, monospace'
></csis-translation-scramble>
      </div>

      <div style="height: 100vh;"></div>

      <csis-gsap-proof debug="true"></csis-gsap-proof>
      <h1>Test</h1>
      <div style="height: 100vh;"></div>

    </main>
    <csis-hidden-reach-footer></csis-hidden-reach-footer>
  </body>
</html>
